name: extract

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      componente:
        description: kernel | dyld | binario
        required: true
        default: dyld
      device:
        description: identificador do device
        required: true
        default: iPhone18,2
      build:
        description: build alvo
        required: true
        default: 24B119
      baseline_build:
        description: build de baseline para o diff
        required: false
        default: 23G83
      target_symbol:
        description: simbolo alvo
        required: false
        default: indefinido
      target_symbols:
        description: simbolos alvo, um por linha (lote)
        required: false
        default: ""
      dyld_path:
        description: caminho da dylib dentro do cache
        required: false
        default: /usr/lib/dyld
      kext_bundle_id:
        description: bundle id do kext (so componente kernel)
        required: false
        default: ""

concurrency: 1

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: instalar ipsw
        run: brew install blacktop/tap/ipsw

      - name: cache ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra_12.0_PUBLIC
          key: ghidra-macOS-ARM64-12.0-af43e8cf

      - name: instalar ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url=https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0_build/ghidra_12.0_PUBLIC_20251205.zip
          curl -fsSL -o "$RUNNER_TEMP/ghidra.zip" "$url"
          echo "af43e8cfb2fa4490cf6020c3a2bde25c159d83f45236a0542688a024e8fc1941  $RUNNER_TEMP/ghidra.zip" | shasum -a 256 -c -
          xattr -d com.apple.quarantine "$RUNNER_TEMP/ghidra.zip" 2>/dev/null || true
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$HOME"
          test -x "$HOME/ghidra_12.0_PUBLIC/support/analyzeHeadless"
          test -x "$HOME/ghidra_12.0_PUBLIC/Ghidra/Features/Decompiler/os/mac_arm_64/decompile"


      - name: extracao
        env:
          COMPONENTE: ${{ inputs.componente }}
          DEVICE: ${{ inputs.device }}
          BUILD: ${{ inputs.build }}
          BASELINE_BUILD: ${{ inputs.baseline_build }}
          TARGET_SYMBOL: ${{ inputs.target_symbol }}
          DYLD_PATH: ${{ inputs.dyld_path }}
          KEXT_BUNDLE_ID: ${{ inputs.kext_bundle_id }}
          RUN_TMP: ${{ runner.temp }}/_tmp
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ETAPA: disasm
        run: ./extract.sh

      - name: decompilacao
        env:
          COMPONENTE: ${{ inputs.componente }}
          DEVICE: ${{ inputs.device }}
          BUILD: ${{ inputs.build }}
          BASELINE_BUILD: ${{ inputs.baseline_build }}
          TARGET_SYMBOL: ${{ inputs.target_symbol }}
          DYLD_PATH: ${{ inputs.dyld_path }}
          KEXT_BUNDLE_ID: ${{ inputs.kext_bundle_id }}
          RUN_TMP: ${{ runner.temp }}/_tmp
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ETAPA: decomp
        run: |
          mkdir -p "$HOME/.ghidra"
          echo "JAVA_HOME=${JAVA_HOME:-<vazio>}"
          "${JAVA_HOME:-/usr}/bin/java" -version 2>&1 || true
          export GHIDRA_HOME="$HOME/ghidra_12.0_PUBLIC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LIST="${{ inputs.target_symbols }}"
          [ -z "$LIST" ] && LIST="${{ inputs.target_symbol }}"
          fail=0
          while IFS= read -r sym; do
            [ -z "$sym" ] && continue
            echo "::group::decomp $sym"
            TARGET_SYMBOL="$sym" ETAPA=decomp ./extract.sh || fail=1
            git add -A
            git diff --cached --quiet || git commit -q -m "feat(decomp): $sym"
            git pull --rebase -q || fail=1
            git push -q || fail=1
            echo "::endgroup::"
          done <<< "$LIST"
          exit $fail

      - name: commitar texto
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(extract): ${{ inputs.build }} ${{ inputs.componente }}"
          git pull --rebase
          git push

      - name: artifact de binarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ inputs.build }}
          path: |
            ${{ runner.temp }}/_tmp/bin
            ${{ runner.temp }}/_tmp/kexts
          retention-days: 14
          if-no-files-found: error
